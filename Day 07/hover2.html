<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<style>
    #box{
        background-color: navy;
        height: 100px;
        width: 100px;
    }

    /* #box:hover{
    transform: translatex (100px)
    transition:2s} */

    #box:hover{
    transform:rotate(360deg);
    transition: 2s
    }

   #triangle{
    background-color: aqua;
    height: 100px;
    width: 100px;
   }

   #triangle:hover{
    transform: rotateX(360deg);
    transition: 2s;
   }

   #box:hover{
    transform: rotateY(150deg);
    transition: 2s;
   }
   #box:hover{
    transform: scaleX(1.4);
    transition: 2s;
   }

</style>

<body>
    <div id="box">
    <div id="triangle">
</body>
